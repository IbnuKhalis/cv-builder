name: Deploy ATS CV Builder to VPS

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  test:
    name: Verify Static & Browser Suite
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
          cache-dependency-path: requirements-dev.txt

      - name: Install pinned test dependencies
        run: python -m pip install -r requirements-dev.txt

      - name: Install Playwright Chromium & OS dependencies
        run: python -m playwright install --with-deps chromium

      - name: Run static verification (verify.py)
        run: python tests/verify.py

      - name: Run browser & PDF verification (test_fixes.py)
        run: python tests/test_fixes.py

  deploy:
    name: Deploy to Production VPS (vps-main)
    needs: test
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'
    steps:
      - name: Deploy via SSH to vps-main
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USERNAME }}
          key: ${{ secrets.VPS_SSH_KEY }}
          port: ${{ secrets.VPS_PORT }}
          script: |
            set -e

            if [ ! -d "/opt/projects/cv-builder/.git" ]; then
              sudo mkdir -p /opt/projects/cv-builder
              sudo chown -R ubuntu:ubuntu /opt/projects/cv-builder
              git clone https://github.com/${{ github.repository }}.git /opt/projects/cv-builder
            fi

            cd /opt/projects/cv-builder
            git fetch origin main
            git reset --hard origin/main

            docker compose -f docker-compose.vps.yml build --pull
            docker compose -f docker-compose.vps.yml up -d --remove-orphans
            docker compose -f docker-compose.vps.yml ps

            # Wait briefly for healthcheck and verify internal HTTP 200 response
            sleep 5
            docker exec cv-builder wget -q -O /dev/null http://127.0.0.1:8080/

            # Reload Caddy Reverse Proxy without downtime
            docker exec caddy-proxy caddy reload --config /etc/caddy/Caddyfile
